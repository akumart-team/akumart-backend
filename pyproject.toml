[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 88
target-version = "py311"  # match your python version

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pylint.typecheck]
ignored-modules = ["redis", "redis.asyncio"]
