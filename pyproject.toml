    "mmh3==5.2.1",
    "multidict==6.7.1",
    "packaging==26.2",
    "passlib==1.7.4",
    "postgrest==2.30.1",
    "propcache==0.5.2",
    "psycopg2-binary==2.9.12",
    "pyasn1==0.6.3",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.1",
    "pygments==2.20.0",
    "pyiceberg==0.11.1",
    "pyjwt==2.13.0",
    "pyparsing==3.3.2",
    "pyroaring==1.1.0",
