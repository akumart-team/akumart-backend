    "charset-normalizer==3.4.7",
    "click==8.4.1",
    "colorama==0.4.6",
    "cryptography==49.0.0",
    "deprecation==2.1.0",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "fastapi==0.136.3",
    "fastapi-mail==1.6.5",
    "fsspec==2026.4.0",
    "greenlet==3.5.1",
    "h11==0.16.0",
    "h2==4.3.0",
    "hpack==4.1.0",
