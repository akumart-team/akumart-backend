    "realtime==2.30.1",
    "redis==8.0.0",
    "regex==2026.5.9",
    "requests==2.34.2",
    "resend==2.32.2",
    "rich==14.3.4",
    "rsa==4.9.1",
    "ruff==0.15.17",
    "six==1.17.0",
    "sqlalchemy==2.0.50",
    "starlette==1.2.1",
    "storage3==2.30.1",
    "strenum==0.4.15",
    "strictyaml==1.7.3",
    "supabase==2.30.1",
    "supabase-auth==2.30.1",
    "supabase-functions==2.30.1",
    "tenacity==9.1.4",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.7.0",
    "uvicorn==0.48.0",
    "watchfiles==1.2.0",
    "websockets==15.0.1",
    "yarl==1.24.2",
    "zstandard==0.25.0",
